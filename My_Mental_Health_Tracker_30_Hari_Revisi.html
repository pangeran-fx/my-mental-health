<head>

<title>My Mental Health · Pelacak 30 Hari</title>
<style>
:root{--bg:#ece7de;--card:#f5f1e9;--card2:#e9e3d7;--soft:#e8e2d6;--tx:#2a2723;--mu:#7a7468;--bd:#dcd4c4;--sh1:rgba(110,90,60,.24);--sh2:rgba(255,255,255,.95);--b:#3f8a3c;--bt:#fff;--bs:#e1ecd6;--r:#c2543a;--rs:#f8ddd5;--g:#2f76b8;--gs:#dcebf8;--y:#a8681a;--ys:#f6e8c8;--hf:'Inter','Segoe UI',system-ui,sans-serif}

*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.55 'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
h1,h2,h3,.hf{font-family:var(--hf)}h2{font-size:17px;margin-bottom:8px}h3{font-size:15px;margin-bottom:4px}
.card,.stat,.tile,.ticket,.circ,.btn{background:linear-gradient(145deg,var(--card),var(--card2));border:0}
.card,.ticket{box-shadow:9px 12px 26px var(--sh1),-7px -7px 18px var(--sh2)}
.card{position:relative;border-radius:24px;padding:16px 18px}
.stat{border-radius:20px;padding:12px 14px;box-shadow:6px 8px 16px var(--sh1),-5px -5px 12px var(--sh2)}.stat b{display:block;font-size:24px;color:var(--b)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mu{color:var(--mu)}.sm{font-size:12px}.wrap{overflow-x:auto}
.btn{padding:9px 16px;border-radius:999px;font-weight:600;box-shadow:4px 6px 12px var(--sh1),-3px -3px 8px var(--sh2)}
.btn:active{box-shadow:inset 3px 4px 8px var(--sh1)}
.btn.p{background:linear-gradient(145deg,color-mix(in srgb,var(--b) 82%,#fff),var(--b));color:var(--bt);box-shadow:4px 7px 14px color-mix(in srgb,var(--b) 40%,transparent)}
.btn.d{background:var(--r);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.in{width:100%;padding:10px 14px;border:0;border-radius:14px;background:var(--soft);box-shadow:inset 3px 4px 8px var(--sh1),inset -3px -3px 8px var(--sh2)}
label.l{display:block;font-weight:700;font-size:12.5px;margin:12px 0 5px}
.sc{display:flex;gap:7px;flex-wrap:wrap}.sc button{min-width:44px;height:44px;border-radius:14px;border:0;background:linear-gradient(145deg,var(--card),var(--card2));box-shadow:4px 5px 10px var(--sh1),-3px -3px 8px var(--sh2);font-weight:700}
.sc button.on{background:var(--b);color:var(--bt);box-shadow:inset 3px 4px 8px rgba(0,0,0,.25)}.sc.m button{font-size:22px}
.chip{border:0;background:var(--soft);padding:8px 13px;border-radius:999px;font-size:13px;box-shadow:3px 4px 8px var(--sh1),-2px -2px 6px var(--sh2)}.chip.on{background:var(--gs);color:var(--g);font-weight:700;box-shadow:inset 2px 3px 6px var(--sh1)}
.tag{background:var(--bs);color:var(--b);border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700}
.bar{height:10px;border-radius:9px;background:var(--soft);box-shadow:inset 2px 2px 5px var(--sh1);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--b),var(--g))}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.heat button{aspect-ratio:1;border-radius:12px;border:0;background:var(--soft);font-size:11px;font-weight:700;color:var(--tx);box-shadow:3px 4px 8px var(--sh1),-2px -2px 6px var(--sh2)}.heat button.f{color:#1d2a14}.heat button.t{outline:3px solid var(--b)}
.alert{border-radius:16px;padding:12px 14px;background:var(--rs);border:1px solid var(--r)}.note{border-radius:16px;padding:12px 14px;background:var(--ys);border:1px solid var(--y)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mu)}
#bc{width:130px;height:130px;border-radius:50%;margin:14px auto;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;color:#fff;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--b) 70%,#fff),var(--b) 60%,#1b3a1a);box-shadow:0 16px 30px var(--sh1);transition:transform 4s ease-in-out;padding:8px}
#toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}#toast.s{opacity:1}
.src{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}.src a{text-decoration:none;color:var(--b);background:var(--bs);border-radius:999px;padding:4px 10px;font-weight:700}.src a:hover{text-decoration:underline}
.tip{background:var(--bs);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:13px}.art{display:block;width:100%;border-radius:16px;margin-bottom:10px}
.hero{position:relative;border-radius:26px;overflow:hidden;color:#fff;min-height:150px;background:linear-gradient(135deg,#3f7f3a,#2f76b8 70%,#7a5fc0 140%);box-shadow:9px 12px 26px var(--sh1)}.hero svg{position:absolute;inset:0;width:100%;height:100%}.hero .tx{position:relative;padding:24px 22px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:150px;max-width:560px}.hero h2{font-size:clamp(21px,4.2vw,30px);line-height:1.2}
/* shell */
.app{display:grid;grid-template-columns:90px minmax(0,1fr);max-width:1120px;margin:0 auto}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0;border-right:1px solid var(--bd)}
.logo{width:60px;height:60px;border-radius:20px;border:0;margin-bottom:6px;color:#fff;display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--b) 80%,#fff),var(--b) 70%,color-mix(in srgb,var(--b) 65%,#000));box-shadow:6px 9px 18px var(--sh1),inset 1px 2px 2px rgba(255,255,255,.5)}
.tile{width:66px;border-radius:20px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mu);box-shadow:6px 8px 16px var(--sh1),-5px -5px 12px var(--sh2)}.tile svg{color:var(--b)}
.tile.on{color:var(--tx);font-weight:700;box-shadow:inset 4px 5px 10px var(--sh1),inset -4px -4px 10px var(--sh2)}
.sup{margin-top:auto;width:66px;border:0;border-radius:20px;padding:10px 4px 8px;font-size:11px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;background:linear-gradient(145deg,#3f4345,#202325);box-shadow:6px 9px 18px var(--sh1)}
.mainc{padding:22px 22px 130px;min-width:0}main{display:flex;flex-direction:column;gap:18px}
.pill{position:fixed;bottom:12px;left:98px;right:14px;max-width:760px;margin:0 auto;height:70px;border-radius:999px;display:flex;align-items:center;justify-content:space-around;z-index:20;background:linear-gradient(145deg,var(--card),var(--card2));box-shadow:0 14px 34px var(--sh1),-4px -4px 14px var(--sh2)}
.pi{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mu);padding:6px 8px}.pi svg{width:34px;height:34px;padding:6px;border-radius:50%}.pi.on{color:var(--b);font-weight:700}.pi.on svg{background:var(--bs)}
.mid{width:78px;height:78px;margin-top:-36px;border-radius:50%;border:0;color:#fff;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,color-mix(in srgb,var(--b) 65%,#fff),var(--b) 55%,color-mix(in srgb,var(--b) 60%,#000));box-shadow:0 14px 26px var(--sh1),inset 2px 3px 4px rgba(255,255,255,.45),inset -3px -5px 8px rgba(0,0,0,.25)}
/* home */
.hello h1{font-size:clamp(28px,5vw,40px);line-height:1.1;font-weight:800}
.r1{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.ticket{display:grid;grid-template-columns:1fr 150px;text-align:left;padding:0;border-radius:24px;color:inherit}
.tl{padding:18px 20px}.tl h2{font-size:30px;font-weight:800;margin:4px 0 0}.eb{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--b);text-transform:uppercase}
.tmeta{display:flex;gap:12px;margin-top:12px;font-size:12px}.tmeta span{display:flex;flex-direction:column;gap:1px}.tmeta svg{color:var(--b)}.tmeta small{color:var(--mu)}
.ts{position:relative;border-radius:0 24px 24px 0;overflow:hidden;background:linear-gradient(170deg,color-mix(in srgb,var(--b) 55%,#fff),var(--b) 55%,color-mix(in srgb,var(--b) 70%,#000));display:flex;flex-direction:column;justify-content:flex-end}
.ts::before{content:'';position:absolute;left:-9px;top:46%;width:18px;height:18px;border-radius:50%;background:var(--bg);z-index:2}
.ts svg{position:absolute;inset:0;width:100%;height:100%}.bcode{position:relative;display:flex;gap:2px;height:44px;align-items:stretch;padding:0 14px 12px}.bcode i{background:#13210f;display:block;border-radius:1px}
.wx{border-radius:24px;padding:16px 18px;color:#fff;background:linear-gradient(160deg,#464b4d,#222527);box-shadow:9px 12px 26px var(--sh1)}
.wx .big{font-size:46px;font-weight:800;line-height:1}.wxr{display:grid;grid-template-columns:repeat(5,1fr);margin-top:12px;border-top:1px solid rgba(255,255,255,.14);padding-top:8px;text-align:center;font-size:12px}
.wxr button{background:none;border:0;color:#fff;border-radius:12px;padding:4px 0;display:flex;flex-direction:column;gap:2px;align-items:center}.wxr button.t{background:rgba(255,255,255,.14)}.wxr b{font-size:17px}
.dio{position:relative}.dsvg{display:block;width:100%;height:auto;transition:transform .18s ease-out;will-change:transform}
.ov{position:absolute;text-align:left}.ov-map{top:-6px;right:0;width:45%;padding:14px}.ov-exp{bottom:0;right:0;width:42%}.ov-best{bottom:3%;left:3%;width:37%}
.mapw{position:relative;margin-top:8px;border-radius:16px;overflow:hidden;line-height:0}.mapw svg{width:100%;height:auto}
.mapbtn{position:absolute;right:10px;bottom:10px;background:#2c3032;color:#fff;border:0;border-radius:14px;padding:8px 13px;font-size:13px;line-height:1.2;display:flex;gap:6px;align-items:center}
.lk{background:none;border:0;color:var(--b);font-weight:600;font-size:13px}.kb{background:none;border:0;color:var(--mu);font-size:20px}
.ex{display:flex;align-items:center;gap:6px}.exm{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:6px 0}
.th{position:relative;width:52px;height:52px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;font-size:24px;flex:none}.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bm{background:none;border:0;color:var(--mu);display:grid;place-items:center;padding:6px}.bm.on{color:var(--b)}.bm.on svg{fill:currentColor}
.card>.bm{position:absolute;right:26px;top:26px;z-index:2;background:rgba(255,255,255,.9);color:#333;border-radius:50%;width:34px;height:34px;padding:0}.card>.bm.on{color:var(--b)}
.tema{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.sw{width:38px;height:38px;border-radius:12px;border:3px solid var(--card);box-shadow:0 0 0 1px var(--bd)}.sw.on{box-shadow:0 0 0 3px var(--tx)}
.ft{display:inline-flex;align-items:center;gap:10px;background:var(--soft);border:0;border-radius:14px;padding:6px 12px;margin:4px 6px 4px 0}.ft.on{box-shadow:inset 0 0 0 2px var(--b)}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.mod.on{display:flex}.mod .card{max-width:460px;width:100%}
.pp .bob{animation:bob .5s ease-in-out infinite alternate}.pp .l1,.pp .l2{transform-box:fill-box;transform-origin:50% 0}.pp .l1{animation:sw 1s ease-in-out infinite alternate}.pp .l2{animation:sw 1s ease-in-out infinite alternate-reverse}
@keyframes sw{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}@keyframes bob{to{transform:translateY(-3px)}}
@media(max-width:760px){.app{grid-template-columns:72px 1fr}.tile,.sup{width:58px}.logo{width:52px;height:52px}.mainc{padding:14px 12px 130px}.pill{left:80px;right:8px}.r1{grid-template-columns:1fr}.ov{position:static;width:auto!important;margin-top:14px}.dio{display:flex;flex-direction:column}.heat{grid-template-columns:repeat(6,1fr)}.tema>div{padding:8px 0}}
/* ===== POP 3D ===== */
:root{--edge:#d6ccb6;--sp:cubic-bezier(.34,1.56,.64,1)}[data-t=dark]{--edge:#0c0f11}
body{background:radial-gradient(520px 380px at 6% 6%,color-mix(in srgb,var(--b) 16%,transparent),transparent),radial-gradient(560px 400px at 96% 34%,rgba(255,160,80,.16),transparent),radial-gradient(480px 360px at 40% 100%,rgba(80,160,255,.12),transparent),var(--bg) fixed}
.card{border:2px solid rgba(255,255,255,.55);box-shadow:0 8px 0 var(--edge),0 22px 34px var(--sh1),inset 0 2px 0 rgba(255,255,255,.8)}
[data-t=dark] .card{border-color:rgba(255,255,255,.06)}
.stat{box-shadow:0 6px 0 var(--edge),0 14px 22px var(--sh1),inset 0 2px 0 rgba(255,255,255,.7);transition:transform .2s var(--sp)}.stat:hover{transform:translateY(-4px) rotate(-.6deg)}
.ticket,.ov-best{transition:transform .2s var(--sp),box-shadow .2s;box-shadow:0 9px 0 var(--edge),0 24px 34px var(--sh1),inset 0 2px 0 rgba(255,255,255,.8)}.ticket:hover,.ov-best:hover{transform:translateY(-4px) rotate(-.5deg)}
.ticket:active,.ov-best:active{transform:translateY(6px) scale(.98);box-shadow:0 2px 0 var(--edge),0 6px 10px var(--sh1)}
.wx{box-shadow:0 9px 0 #0e1011,0 24px 34px var(--sh1),inset 0 2px 0 rgba(255,255,255,.18)}
.hero{box-shadow:0 9px 0 #20462a,0 24px 34px var(--sh1),inset 0 2px 0 rgba(255,255,255,.3)}
.btn,.circ,.chip,.sc button,.heat button,.tile,.sup,.ft,.sw{transition:transform .14s var(--sp),box-shadow .14s}
.btn{box-shadow:0 5px 0 var(--edge),0 10px 16px var(--sh1),inset 0 2px 0 rgba(255,255,255,.7)}.btn:hover{transform:translateY(-3px)}
.btn.p{box-shadow:0 5px 0 color-mix(in srgb,var(--b) 55%,#000),0 12px 18px color-mix(in srgb,var(--b) 38%,transparent),inset 0 2px 0 rgba(255,255,255,.4)}
.btn.d{box-shadow:0 5px 0 #8f3320,0 12px 18px rgba(194,84,58,.35)}
.btn:active,.circ:active,.chip:active,.sc button:active,.heat button:active,.tile:active,.sup:active,.pi:active,.ft:active,.sw:active,.exm:active,.bm:active{transform:translateY(4px) scale(.96)!important;box-shadow:0 1px 0 var(--edge),0 3px 6px var(--sh1)}
.chip,.sc button,.heat button{box-shadow:0 4px 0 var(--edge),0 8px 12px var(--sh1)}.chip:hover,.sc button:hover,.heat button:hover{transform:translateY(-2px)}
.sc button.on{box-shadow:0 4px 0 color-mix(in srgb,var(--b) 55%,#000);animation:pop .4s var(--sp)}
.chip.on{box-shadow:0 4px 0 color-mix(in srgb,var(--g) 50%,#000);animation:pop .4s var(--sp)}
.in{box-shadow:inset 0 4px 8px var(--sh1),inset 0 -2px 0 rgba(255,255,255,.6)}.in:focus{box-shadow:inset 0 4px 8px var(--sh1),0 0 0 3px color-mix(in srgb,var(--b) 45%,transparent)}
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}.hello h1{text-shadow:0 3px 0 var(--edge),0 10px 14px var(--sh1)}
.mas{background:none;border:0;width:112px;flex:none;animation:float 3.2s ease-in-out infinite;filter:drop-shadow(0 10px 8px var(--sh1))}.mas:hover{animation-duration:1.2s}.mas svg{width:100%;height:auto;display:block}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4s infinite}
.bub{position:absolute;right:126px;top:-6px;background:var(--card);padding:9px 14px;border-radius:18px 18px 4px 18px;box-shadow:0 5px 0 var(--edge),0 14px 22px var(--sh1);font-weight:600;max-width:200px;opacity:0;transform:scale(.5);transform-origin:right bottom;pointer-events:none;transition:.35s var(--sp);z-index:3}.bub.on{opacity:1;transform:scale(1)}
.logo{box-shadow:0 6px 0 color-mix(in srgb,var(--b) 55%,#000),0 14px 20px var(--sh1),inset 1px 3px 3px rgba(255,255,255,.55)}
.tile{box-shadow:0 6px 0 var(--edge),0 14px 20px var(--sh1),inset 0 2px 0 rgba(255,255,255,.7)}
.tile.on{box-shadow:inset 0 4px 10px var(--sh1);transform:translateY(3px)}
.tile svg,.pi svg{color:var(--ic,var(--b));background:color-mix(in srgb,var(--ic,var(--b)) 15%,var(--card));border-radius:13px;padding:7px;width:38px;height:38px;box-shadow:0 3px 0 color-mix(in srgb,var(--ic,var(--b)) 35%,var(--card2)),0 6px 10px var(--sh1)}
.rail .tile:nth-child(2){--ic:#ff7a59}.rail .tile:nth-child(3){--ic:#2f95ff}.rail .tile:nth-child(4){--ic:#2fb344}.rail .tile:nth-child(5){--ic:#ff4d8d}.rail .tile:nth-child(6){--ic:#8b5cf6}
.pill .pi:nth-child(1){--ic:#2f95ff}.pill .pi:nth-child(2){--ic:#8b5cf6}.pill .pi:nth-child(4){--ic:#14b8a6}.pill .pi:nth-child(5){--ic:#f59e0b}
.pi.on svg{background:color-mix(in srgb,var(--ic) 24%,var(--card));transform:translateY(-3px) scale(1.08)}.pi svg{transition:transform .2s var(--sp)}
.pill{box-shadow:0 8px 0 var(--edge),0 24px 36px var(--sh1),inset 0 2px 0 rgba(255,255,255,.7)}
.mid{box-shadow:0 8px 0 color-mix(in srgb,var(--b) 50%,#000),0 22px 30px color-mix(in srgb,var(--b) 40%,transparent),inset 2px 3px 4px rgba(255,255,255,.55);transition:transform .14s var(--sp),box-shadow .14s}.mid:hover{transform:translateY(-4px) scale(1.05)}.mid:active{transform:translateY(6px) scale(.94);box-shadow:0 2px 0 color-mix(in srgb,var(--b) 50%,#000)}
.sup{box-shadow:0 6px 0 #0e1011,0 14px 20px var(--sh1)}
.dsvg{filter:drop-shadow(0 26px 22px rgba(70,45,20,.3))}
.th{box-shadow:0 4px 0 rgba(0,0,0,.2),0 8px 12px var(--sh1)}
.go>*{animation:popin .6s var(--sp) backwards}.go>*:nth-child(2){animation-delay:.07s}.go>*:nth-child(3){animation-delay:.14s}.go>*:nth-child(4){animation-delay:.21s}.go>*:nth-child(5){animation-delay:.28s}.go>*:nth-child(n+6){animation-delay:.34s}
.mod.on .card{animation:popin .5s var(--sp)}#toast.s{animation:tpop .45s var(--sp)}
.sq{animation:squish .38s var(--sp)}
.sp{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:99;transform:translate(-50%,-50%);animation:spark .6s ease-out forwards;box-shadow:0 2px 0 rgba(0,0,0,.18)}
@keyframes popin{0%{opacity:0;transform:translateY(26px) scale(.9) rotateX(14deg)}60%{opacity:1;transform:translateY(-5px) scale(1.02)}100%{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(.88,.94)}65%{transform:scale(1.08,1.05)}100%{transform:scale(1)}}
@keyframes spark{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes tpop{0%{transform:translateX(-50%) translateY(20px) scale(.8)}60%{transform:translateX(-50%) translateY(-4px) scale(1.05)}100%{transform:translateX(-50%)}}
@media(max-width:760px){.mas{width:84px}.bub{right:90px}}

<script>
/* ===== Data & util ===== */
const KEY='mmh_v5';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk=()=>({name:'',start:'',days:{},scr:{phq:{},gad:{}},ref:{},ui:{}});
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&typeof r==='object'&&r.days&&typeof r.days==='object'){const z=mk();z.name=typeof r.name==='string'?r.name.slice(0,100):'';z.start=typeof r.start==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.start)?r.start:'';z.days=Object.fromEntries(Object.entries(r.days).filter(([k,v])=>/^[1-9]$|^1[0-9]$|^2[0-9]$|^30$/.test(k)&&v&&typeof v==='object').map(([k,v])=>[k,v]));z.ref=r.ref&&typeof r.ref==='object'?r.ref:{};z.ui=r.ui&&typeof r.ui==='object'?r.ui:{};z.scr={phq:{},gad:{}};for(const q of ['phq','gad'])for(const slot of [1,15,30]){const a=r.scr?.[q]?.[slot];if(Array.isArray(a)&&a.length===(q==='phq'?9:7)&&a.every(x=>Number.isInteger(x)&&x>=0&&x<=3))z.scr[q][slot]=a.slice()}return z}}catch(e){}return mk()}
let D=load(),tab='home',cur=1,sc={ins:'phq',slot:1,draft:{}},tt;
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Penyimpanan penuh/diblokir. Ekspor data Anda.')}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('s'),2200)}
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const dateOf=n=>{const a=new Date(D.start+'T00:00');a.setDate(a.getDate()+n-1);return a};
const fmt=d=>d.toLocaleDateString('id-ID',{day:'numeric',month:'short'});
const today=()=>{if(!D.start)return 1;const n=Math.floor((new Date(nowISO()+'T00:00')-new Date(D.start+'T00:00'))/864e5)+1;return Math.min(30,Math.max(1,n))};
const E=n=>D.days[n]||{};
const filled=n=>+E(n).mood>0;
const MOODS=['😞','😕','😐','🙂','😄'],ML=['Sangat buruk','Kurang baik','Biasa','Baik','Sangat baik'];
const HAB=[['screen','📵 Jeda layar 30 mnt'],['move','🏃 Gerak ringan'],['water','💧 Minum cukup'],['out','🌤️ Keluar rumah'],['social','💬 Ngobrol orang dekat']];

function set(n,k,v,re){if(!Number.isInteger(+n)||+n<1||+n>30)return;D.days[n]=D.days[n]||{};D.days[n][k]=v;save();if(re)render()}
function tgl(n,k,v){const x=E(n);set(n,k,x[k]===v?'':v,true)}

/* ===== Statistik ===== */
const logged=()=>{const L=[];for(let i=1;i<=30;i++)if(filled(i))L.push({day:i,...E(i)});return L};
const av=(L,k)=>{const a=L.map(x=>x[k]).filter(v=>v!==''&&v!=null&&!isNaN(v)).map(Number);return a.length?a.reduce((p,c)=>p+c,0)/a.length:null};
const f1=v=>v==null?'—':v.toFixed(1);
function streak(){let n=today(),s=0;if(!filled(n))n--;while(n>=1&&filled(n)){s++;n--}return s}
function corr(L,a,b){const p=L.filter(x=>x[a]!==''&&x[a]!=null&&x[b]).map(x=>[+x[a],+x[b]]);if(p.length<5)return null;const n=p.length,mx=p.reduce((s,q)=>s+q[0],0)/n,my=p.reduce((s,q)=>s+q[1],0)/n;let xy=0,xx=0,yy=0;p.forEach(q=>{xy+=(q[0]-mx)*(q[1]-my);xx+=(q[0]-mx)**2;yy+=(q[1]-my)**2});return xx&&yy?xy/Math.sqrt(xx*yy):null}
function wk(a,b){const L=logged().filter(x=>x.day>=a&&x.day<=b);return{n:L.length,m:av(L,'mood'),e:av(L,'energy'),s:av(L,'stress'),z:av(L,'sleep')}}
function insights(L){
  if(L.length<5)return['Isi minimal 5 hari catatan agar pola Anda bisa dianalisis.'];
  const o=[],am=av(L,'mood'),as=av(L,'stress'),az=av(L,'sleep');
  const first=L.slice(0,Math.min(7,Math.floor(L.length/2))),last=L.slice(-first.length);
  const d=av(last,'mood')-av(first,'mood');
  o.push(Math.abs(d)<.4?'Mood Anda relatif stabil dari awal hingga catatan terbaru.':d>0?`Mood naik ${d.toFixed(1)} poin dibanding awal pencatatan. Pertahankan kebiasaan yang membantu.`:`Mood turun ${Math.abs(d).toFixed(1)} poin dibanding awal pencatatan. Perhatikan pemicu dan waktu istirahat Anda.`);
  const c=corr(L,'sleep','mood');
  if(c!=null&&Math.abs(c)>=.3)o.push(c>0?`Hari dengan tidur lebih panjang cenderung diikuti mood lebih baik (r = ${c.toFixed(2)}).`:`Tidur lebih panjang justru berhubungan dengan mood lebih rendah (r = ${c.toFixed(2)}). Cek kualitas tidur dan jam bangun Anda.`);
  if(az!=null&&az<7)o.push(`Rata-rata tidur ${az.toFixed(1)} jam, di bawah anjuran 7–9 jam untuk dewasa (Watson dkk., 2015).`);
  HAB.forEach(([k,lab])=>{const w=L.filter(x=>x.h&&x.h[k]),wo=L.filter(x=>!(x.h&&x.h[k]));if(w.length>=3&&wo.length>=3){const df=av(w,'mood')-av(wo,'mood');if(Math.abs(df)>=.5)o.push(`${lab.slice(3)}: mood rata-rata ${df>0?'lebih tinggi':'lebih rendah'} ${Math.abs(df).toFixed(1)} poin pada hari Anda melakukannya.`)}});
  const tr={};L.forEach(x=>{if(x.trigger)tr[x.trigger]=(tr[x.trigger]||0)+1});const top=Object.entries(tr).sort((a,b)=>b[1]-a[1])[0];
  if(top)o.push(`Pemicu paling sering: ${esc(top[0])} (${top[1]} hari).`);
  if(as>=4)o.push('Stres rata-rata Anda tinggi (≥4/5). Kurangi beban yang bisa ditunda dan jadwalkan jeda pemulihan.');
  return o;
}
const needHelp=L=>{const l=L.slice(-7);return l.length>=5&&(av(l,'mood')<=2||av(l,'stress')>=4.3)};
